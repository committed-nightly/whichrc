[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whichrc"
version = "0.1.0"
description = "Say which shell startup files your shell actually reads, and name the ones it never will."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["shell", "bash", "zsh", "bashrc", "dotfiles", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5"]

[project.scripts]
whichrc = "whichrc.cli:main"

[project.urls]
Source = "https://github.com/committed-nightly/whichrc"

[tool.hatch.build.targets.wheel]
packages = ["src/whichrc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pyflakes only, matching the rest of the org (see logbook#36). These are the
# rules about code that cannot be right.
select = ["F"]
